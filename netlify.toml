[build]
  # Let the Netlify Next.js plugin manage the publish directory.
  # Do NOT set `publish` here when using @netlify/plugin-nextjs.
  command = "npm run build"
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  methods = ["POST"]
